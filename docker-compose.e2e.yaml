name: closeout-e2e

# Fully self-contained: every value here is a fixture, no .env required.
# `bin/closeout e2e` runs the same way on any machine against a clean
# database, then tears everything down. The phone number below is a test
# fixture inside this isolated stack only.

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_SSL: "false"
  POSTGRES_DB: closeout_e2e
  POSTGRES_USER: closeout_e2e
  POSTGRES_PASSWORD: e2e-fixed-postgres-password

x-app-env: &app-env
  PUBLIC_BASE_URL: http://web:3001
  INTERNAL_API_SECRET: e2e-fixed-internal-secret
  STORE_SLUG: loja-e2e
  STORE_NAME: Loja E2E

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: closeout_e2e
      POSTGRES_USER: closeout_e2e
      POSTGRES_PASSWORD: e2e-fixed-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  setup:
    image: closeout-cli:local
    build:
      context: .
      dockerfile: docker/Dockerfile.cli
    environment:
      CI: "true"
    command: sh -lc "pnpm install --frozen-lockfile && pnpm turbo build --filter=@closeout/config"
    volumes:
      - .:/closeout

  migration:
    image: closeout-cli:local
    pull_policy: never
    command: ["pnpm", "turbo", "migration:run", "--filter=api"]
    environment:
      <<: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    volumes:
      - .:/closeout

  api:
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    environment:
      <<: [*postgres-env, *app-env]
      PORT: "3000"
      HOST: 0.0.0.0
      MEDIA_DIR: /data/media
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      start_period: 20s
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - .:/closeout
      - e2e-api-dist:/closeout/apps/api/dist
      - e2e-media:/data/media

  provision:
    image: closeout-cli:local
    pull_policy: never
    working_dir: /closeout/apps/api
    environment:
      <<: [*postgres-env, *app-env]
      MEDIA_DIR: /data/media
      CLOSEOUT_PASSWORD: e2e-admin-password
    command: >
      sh -c "pnpm --silent build &&
             node dist/cli/main.js admin:create --email admin@e2e.test --name 'Ana Teste' --whatsapp '+55 11 98888-7777' &&
             node dist/cli/main.js seed:demo --whatsapp '+55 11 97777-6666'"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/closeout
      - e2e-provision-dist:/closeout/apps/api/dist
      - e2e-media:/data/media

  web:
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile
    environment:
      <<: *app-env
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health || exit 1"]
      start_period: 20s
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - .:/closeout
      - e2e-web-next:/closeout/apps/web/.next

  web-e2e:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.e2e
    environment:
      E2E_APP_BASE_URL: http://web:3001
      E2E_ADMIN_EMAIL: admin@e2e.test
      E2E_ADMIN_PASSWORD: e2e-admin-password
      CI: "true"
    depends_on:
      web:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    volumes:
      - .:/closeout

volumes:
  e2e-api-dist:
  e2e-provision-dist:
  e2e-media:
  e2e-web-next:
