name: Seed caches

# Pull requests can read caches saved on main but never write their own, so
# this workflow refreshes main's entries after every merge. Its job names must
# stay out of the CI check names.

on:
  push:
    branches: [main]

# Never cancel: back-to-back merges must not leave main half-seeded.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dependencies:
    name: Seed dependency cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain and save the pnpm store
        uses: ./.github/actions/setup-toolchain
        with:
          save-cache: "true"

  images:
    name: Seed ${{ matrix.label }} image cache
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            label: API
          - app: web
            label: web
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the production image and save its layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,scope=image-${{ matrix.app }},mode=max
