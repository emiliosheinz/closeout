name: CI

# Job display names are the required-check contract: renaming one silently
# drops it from branch protection. Keep them in sync with docs/development.md.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: ${{ matrix.check }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: check
            command: pnpm check
          - check: typecheck
            command: pnpm typecheck
          - check: unit
            command: pnpm test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ${{ matrix.command }}

  database:
    name: ${{ matrix.check }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: integration
            command: pnpm --filter api test:integration
          - check: migration-drift
            command: pnpm --filter api migration:run && pnpm --filter api migration:check
    # Integration global setup creates and drops databases, so the user must be
    # the service's superuser.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: closeout
          POSTGRES_USER: closeout
          POSTGRES_PASSWORD: closeout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U closeout -d closeout"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_SSL: "false"
      POSTGRES_DB: closeout
      POSTGRES_USER: closeout
      POSTGRES_PASSWORD: closeout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ${{ matrix.command }}

  commitlint:
    name: commitlint
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The PR's real head, not the synthetic merge commit, with full history
      # so the range against main resolves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint the PR's own non-merge commits
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          shas=$(git rev-list --no-merges "$BASE..$HEAD_SHA")
          for sha in $shas; do
            if ! git log -1 --format=%B "$sha" | pnpm --silent commitlint; then
              echo "::error::Commit $(git rev-parse --short "$sha") violates the commit message rules"
              status=1
            fi
          done
          exit "$status"

  workflow-lint:
    name: workflow-lint
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  image:
    name: image-${{ matrix.app }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Builds without pushing (the action default) and restores the layer cache
      # only: the main-branch seeding workflow is the sole cache writer.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          cache-from: type=gha,scope=image-${{ matrix.app }}

  e2e:
    name: e2e
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.e2e.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No --rm, so the runner container's log survives for the diagnostics;
      # teardown removes it.
      # Shorter than the job limit, so a hang fails this step and the
      # diagnostics below still run.
      - name: Run Playwright against the e2e stack
        timeout-minutes: 30
        run: >-
          docker compose run --build -e PLAYWRIGHT_HTML_OPEN=never
          web-e2e pnpm --filter web test:e2e --reporter=list,html
      - name: Collect service logs
        if: failure() || cancelled()
        run: |
          mkdir -p e2e-logs
          for service in $(docker compose config --services); do
            docker compose logs --no-color "$service" > "e2e-logs/$service.log" 2>&1 || true
          done
          # compose logs skips one-off `run` containers, so read the runner's directly.
          docker ps -aq --filter label=com.docker.compose.project=closeout-e2e \
            --filter label=com.docker.compose.oneoff=True |
            xargs -r -n1 docker logs > e2e-logs/web-e2e.log 2>&1 || true
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: |
            e2e-logs/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - name: Tear down the e2e stack
        if: always()
        run: docker compose down -v --remove-orphans
