name: Deploy infrastructure

# Plans .railway/railway.ts against production on pull requests; on main it then
# applies. Railway holds each commit's deploys until this run finishes. Every plan passes the data-store guard first.
#
# No concurrency group: GitHub cancels all but one pending run per group, which
# would drop an apply. Railway rejects a plan whose environment has changed, so
# overlapping applies fail instead. Never cancel a run by hand for the same reason.

on:
  pull_request:
    branches: [main]
    paths: &infra-paths
      - .railway/**
      - package.json
      - pnpm-lock.yaml
      - scripts/railway-plan-guard*
      - scripts/fixtures/railway-plan/**
      - .github/workflows/deploy-infrastructure.yml
  push:
    branches: [main]
    paths: *infra-paths
  workflow_dispatch:
    inputs:
      first-time-setup:
        description: Allow creating the database and the bucket (the first apply of an empty environment only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Keep in step with CLI_VERSION in scripts/railway-plan-guard.ts.
  RAILWAY_CLI_VERSION: 5.70.0

jobs:
  deploy-infrastructure:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Apply' }} production changes
    # Fork pull requests get no token, and no run.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Pull requests use the plan-only environment; only pushes and manual runs
    # on main reach the one that applies.
    environment: ${{ github.event_name == 'pull_request' && 'production-plan' || 'production' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node, pnpm and dependencies
        uses: ./.github/actions/setup-toolchain

      - name: Test the data-store guard
        run: node --test scripts/railway-plan-guard.test.ts

      - name: Install the Railway CLI
        run: npm install -g "@railway/cli@$RAILWAY_CLI_VERSION"

      - name: Plan
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway config plan --out plan.json

      - name: Report the plan
        run: jq -r .diff plan.json >> "$GITHUB_STEP_SUMMARY"

      - name: Check the plan leaves data stores alone
        env:
          FIRST_TIME_SETUP: ${{ inputs.first-time-setup }}
        run: |
          flags=()
          if [ "$FIRST_TIME_SETUP" = "true" ]; then flags+=(--setup); fi
          node scripts/railway-plan-guard.ts plan.json "${flags[@]}"

      # --confirm-destructive lets removals through; the guard above is what
      # keeps the data stores safe.
      - name: Apply exactly the checked plan
        if: github.event_name != 'pull_request'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway config apply --plan plan.json --yes --confirm-destructive
