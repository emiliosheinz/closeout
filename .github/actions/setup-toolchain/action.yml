name: Set up Node, pnpm and dependencies
description: Node and pnpm at the repo's versions, a cached frozen install and the shared config build.

inputs:
  save-cache:
    description: >-
      Save the pnpm store after install. Only warm-main-caches.yml sets this, so
      pull requests never evict main's cache entries.
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node from package.json engines
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        # Off explicitly so pull requests never save a cache, whatever
        # packageManager names.
        package-manager-cache: false

    - name: Set up pnpm from packageManager
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore the pnpm store
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Save the pnpm store
      if: inputs.save-cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.restore.outputs.cache-primary-key }}

    # App Biome configs extend the built shared config, so this precedes any check.
    - name: Build the shared config
      shell: bash
      run: pnpm turbo build --filter=@closeout/config
